<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroBgGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#2D0B1C" />
      <stop offset="45%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </radialGradient>

    <!-- Animated Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.25;0.45;0.25" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>

    <!-- Rose Horizon Glow Line -->
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="20%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="80%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <!-- Neural Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#E5B5C7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.18" />
      <circle cx="40" cy="40" r="1" fill="#C77B9B" fill-opacity="0.25" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="lineGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="340" rx="16" fill="url(#heroBgGrad)" stroke="#381022" stroke-width="1.5" />

  <!-- Ambient Pulsing Glow Circle -->
  <rect width="920" height="340" rx="16" fill="url(#ambientGlow)" />

  <!-- Technical Grid Overlay -->
  <rect width="920" height="340" rx="16" fill="url(#techGrid)" />

  <!-- Vignette / Border Shadow Mask -->
  <rect width="920" height="340" rx="16" fill="none" stroke="#5A1733" stroke-width="1" stroke-opacity="0.6" />

  <!-- Restrained Orbital Geometry (Top Right) -->
  <g transform="translate(760, 110)" opacity="0.65">
    <!-- Outer Orbit -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite" />
    </circle>
    <!-- Mid Orbit -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="8 8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
    </circle>
    <!-- Inner Core -->
    <circle cx="0" cy="0" r="28" fill="#451126" fill-opacity="0.3" stroke="#E5B5C7" stroke-width="1" opacity="0.8" />
    <circle cx="0" cy="0" r="6" fill="#F8F0F3" filter="url(#softGlow)" />
    <!-- Orbiting Satellite Node -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
      <circle cx="85" cy="0" r="3.5" fill="#E5B5C7" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Animated Neural Waveform Path across canvas -->
  <path d="M 0 250 C 180 230, 260 275, 420 240 C 580 205, 680 270, 920 220" 
        fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="14 10" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="0" to="-480" dur="20s" repeatCount="indefinite" />
  </path>

  <path d="M 0 255 C 200 275, 340 215, 520 250 C 700 285, 780 210, 920 245" 
        fill="none" stroke="#701A3D" stroke-width="1.2" stroke-linecap="round"
        stroke-dasharray="8 12" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="480" dur="26s" repeatCount="indefinite" />
  </path>

  <!-- Left Technical Accents -->
  <g transform="translate(56, 45)">
    <!-- Terminal Identifier Badge -->
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#E5B5C7" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.5">AI / ML SPECIALIST</text>

    <!-- Sub Status pill -->
    <rect x="180" y="0" width="125" height="26" rx="13" fill="#190B12" stroke="#451126" stroke-width="1" />
    <text x="194" y="17" fill="#A37385" class="font-mono" font-size="10.5" font-weight="500" letter-spacing="1">RESEARCH LEAD</text>
  </g>

  <!-- Main Hero Title & Identity -->
  <g transform="translate(56, 138)">
    <!-- Name -->
    <text x="0" y="0" fill="url(#textGrad)" class="font-sans" font-size="40" font-weight="800" letter-spacing="0.5">
      SHIVRAJ SINGH PANWAR
    </text>

    <!-- Role Line -->
    <text x="0" y="34" fill="#E5B5C7" class="font-sans" font-size="14.5" font-weight="600" letter-spacing="2.2">
      AI/ML ENGINEER  •  FULL-STACK DEVELOPER  •  CREATIVE TECHNOLOGIST
    </text>

    <!-- Description / Purpose Line -->
    <text x="0" y="62" fill="#D4A5B8" class="font-sans" font-size="13" font-weight="400" letter-spacing="0.4" opacity="0.9">
      Designing intelligent autonomous architectures, resilient cloud security &amp; ML pipelines
    </text>
  </g>

  <!-- Glowing Underline / Horizon Beam -->
  <path d="M 56 226 L 864 226" stroke="url(#horizonGrad)" stroke-width="1.8" filter="url(#lineGlow)" />
  <circle cx="56" cy="226" r="2.5" fill="#E5B5C7" />
  <circle cx="864" cy="226" r="2.5" fill="#E5B5C7" />

  <!-- Bottom Technical Telemetry Bar -->
  <g transform="translate(56, 272)" class="font-mono" font-size="11">
    <!-- Item 1: Affiliation -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#A37385" font-weight="500">AFFILIATION</text>
      <text x="0" y="18" fill="#F8F0F3" font-weight="600">D.Y. Patil Univ &amp; SRM-AP</text>
    </g>

    <!-- Separator -->
    <line x1="215" y1="-2" x2="215" y2="24" stroke="#451126" stroke-width="1" />

    <!-- Item 2: Core Focus -->
    <g transform="translate(245, 0)">
      <text x="0" y="0" fill="#A37385" font-weight="500">CORE FOCUS</text>
      <text x="0" y="18" fill="#F8F0F3" font-weight="600">Quantum DevSecOps &amp; RAG</text>
    </g>

    <!-- Separator -->
    <line x1="475" y1="-2" x2="475" y2="24" stroke="#451126" stroke-width="1" />

    <!-- Item 3: Public Repos -->
    <g transform="translate(505, 0)">
      <text x="0" y="0" fill="#A37385" font-weight="500">TELEMETRY</text>
      <text x="0" y="18" fill="#F8F0F3" font-weight="600">11 Repos  •  295 Commits</text>
    </g>

    <!-- Separator -->
    <line x1="705" y1="-2" x2="705" y2="24" stroke="#451126" stroke-width="1" />

    <!-- Item 4: Location -->
    <g transform="translate(735, 0)">
      <text x="0" y="0" fill="#A37385" font-weight="500">BASE</text>
      <text x="0" y="18" fill="#F8F0F3" font-weight="600">Pune, India</text>
    </g>
  </g>
</svg>