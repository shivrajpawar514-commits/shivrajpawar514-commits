<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#14070E" />
    </linearGradient>
    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <g transform="translate(0, 0)">
    <!-- Card 1 -->
    <g transform="translate(0, 10)">
      <rect width="215" height="100" rx="10" fill="url(#cardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />
      <rect x="0" y="0" width="215" height="4" rx="2" fill="#701A3D" />
      <text x="20" y="32" fill="#C77B9B" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.2">RESEARCH LEAD</text>
      <text x="20" y="64" fill="#F8F0F3" class="font-sans" font-size="22" font-weight="700">SRM Univ-AP</text>
      <text x="20" y="84" fill="#E5B5C7" class="font-sans" font-size="11.5" opacity="0.85">Adaptive Quantum DevSecOps</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(235, 10)">
      <rect width="215" height="100" rx="10" fill="url(#cardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />
      <rect x="0" y="0" width="215" height="4" rx="2" fill="#C77B9B" />
      <text x="20" y="32" fill="#C77B9B" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.2">AI/ML ARCHITECTURES</text>
      <text x="20" y="64" fill="#F8F0F3" class="font-sans" font-size="22" font-weight="700">11 Repos</text>
      <text x="20" y="84" fill="#E5B5C7" class="font-sans" font-size="11.5" opacity="0.85">MLOps • XAI • RAG • Computer Vision</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(470, 10)">
      <rect width="215" height="100" rx="10" fill="url(#cardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />
      <rect x="0" y="0" width="215" height="4" rx="2" fill="#E5B5C7" />
      <text x="20" y="32" fill="#C77B9B" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.2">GIT TELEMETRY</text>
      <text x="20" y="64" fill="#F8F0F3" class="font-sans" font-size="22" font-weight="700">295 Commits</text>
      <text x="20" y="84" fill="#E5B5C7" class="font-sans" font-size="11.5" opacity="0.85">Active GitHub Annual Velocity</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(705, 10)">
      <rect width="215" height="100" rx="10" fill="url(#cardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />
      <rect x="0" y="0" width="215" height="4" rx="2" fill="#701A3D" />
      <text x="20" y="32" fill="#C77B9B" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.2">CREDENTIALS</text>
      <text x="20" y="64" fill="#F8F0F3" class="font-sans" font-size="22" font-weight="700">Dual Certified</text>
      <text x="20" y="84" fill="#E5B5C7" class="font-sans" font-size="11.5" opacity="0.85">Coursera RAG &amp; Kaggle Vision</text>
    </g>
  </g>
</svg>