<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 85" width="100%" height="100%">
  <defs>
    <radialGradient id="footerBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="35%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="65%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Background Card -->
  <rect width="920" height="85" rx="12" fill="url(#footerBg)" stroke="#381022" stroke-width="1.2" />

  <!-- Animated Horizon / Glowing Line -->
  <line x1="120" y1="18" x2="800" y2="18" stroke="url(#beamGrad)" stroke-width="1.2">
    <animate attributeName="stroke-dasharray" values="100 600; 300 400; 100 600" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Typography -->
  <g transform="translate(460, 44)" text-anchor="middle">
    <text x="0" y="0" fill="#F8F0F3" class="font-sans" font-size="12" font-weight="700" letter-spacing="2">
      CRAFTED WITH PRECISION  •  COMMITTED TO EXCELLENCE
    </text>
    <text x="0" y="20" fill="#A37385" class="font-mono" font-size="10" font-weight="500" letter-spacing="1">
      SHIVRAJ SINGH PANWAR  •  AI/ML &amp; SYSTEMS  •  PUNE, INDIA
    </text>
  </g>
</svg>